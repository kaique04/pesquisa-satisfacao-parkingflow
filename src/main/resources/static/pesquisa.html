<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pesquisa de Satisfacao"</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        min-height: 100vh;
        background: #FAFAFA;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .cartao {
        background: #FFFFFF;
        border: 1px solid #EAEAEA;
        border-radius: 20px;
        max-width: 480px;
        width: 100%;
        padding: 30px 24px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.06);
        text-align: center;
    }

    .faixa {
        background: #FF6B4A;
        color: #fff;
        font-weight: bold;
        font-size: 14px;
        letter-spacing: 1px;
        padding: 8px;
        border-radius: 10px;
        margin-bottom: 16px;
        text-transform: uppercase;
    }

    h1 {
        font-size: 24px;
        color: #1A1A1A;
        margin-bottom: 8px;
    }

    p.subtitulo {
        color: #6B6B6B;
        margin-bottom: 24px;
        font-size: 14px;
    }

    .notas {
        display: flex;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 20px;
    }

    .botao-nota {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: 2px solid #EAEAEA;
        background: #fff;
        font-size: 22px;
        font-weight: bold;
        color: #1A1A1A;
        cursor: pointer;
        transition: transform 0.15s, background 0.15s, border-color 0.15s, color 0.15s;
    }

    .botao-nota:hover {
        border-color: #FF6B4A;
    }

    .botao-nota.selecionada {
        background: #FF6B4A;
        color: #fff;
        border-color: #FF6B4A;
        transform: scale(1.08);
    }

    textarea {
        width: 100%;
        min-height: 70px;
        border: 2px solid #EAEAEA;
        border-radius: 10px;
        padding: 10px;
        font-size: 14px;
        resize: vertical;
        margin-bottom: 20px;
        color: #1A1A1A;
    }

    button.principal {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 10px;
        background: #FF6B4A;
        color: #fff;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.15s;
    }

    button.principal:hover {
        background: #E6552F;
    }

    button.secundario {
        width: 100%;
        padding: 10px;
        border: none;
        background: transparent;
        color: #FF6B4A;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 12px;
        text-decoration: underline;
    }

    .mensagem-erro {
        display: none;
        background: #FFF1EC;
        color: #C0392B;
        padding: 12px;
        border-radius: 10px;
        margin-bottom: 16px;
        font-size: 14px;
        font-weight: bold;
    }

    .escondido {
        display: none;
    }

    .confirmacao {
        padding: 10px;
    }

    .confirmacao .emoji {
        font-size: 60px;
        margin-bottom: 10px;
    }

    .resultado-media {
        font-size: 48px;
        font-weight: bold;
        color: #FF6B4A;
        margin: 10px 0;
    }

    .barra-percentual {
        display: flex;
        height: 24px;
        border-radius: 12px;
        overflow: hidden;
        margin: 16px 0;
    }

    .barra-positiva {
        background: #2ECC71;
        color: #fff;
        font-size: 12px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .barra-negativa {
        background: #E74C3C;
        color: #fff;
        font-size: 12px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .alerta-baixa {
        display: none;
        background: #E74C3C;
        color: #fff;
        font-weight: bold;
        padding: 14px;
        border-radius: 10px;
        margin-top: 16px;
    }

    .tendencia {
        margin-top: 10px;
        font-size: 14px;
        color: #6B6B6B;
    }

    @media (max-width: 380px) {
        .botao-nota {
            width: 46px;
            height: 46px;
            font-size: 18px;
        }
    }
</style>
</head>
<body>

<div class="cartao">

    <!-- TELA 1: FORMULARIO -->
    <div id="telaFormulario">
        <div class="faixa">Pesquisa relampago</div>
        <h1>O que voce achou do app?</h1>
        <p class="subtitulo">Sua opiniao ajuda o time a melhorar</p>

        <div class="mensagem-erro" id="mensagemErro"></div>

        <div class="notas" id="containerNotas">
            <button type="button" class="botao-nota" data-nota="1">1</button>
            <button type="button" class="botao-nota" data-nota="2">2</button>
            <button type="button" class="botao-nota" data-nota="3">3</button>
            <button type="button" class="botao-nota" data-nota="4">4</button>
            <button type="button" class="botao-nota" data-nota="5">5</button>
        </div>

        <textarea id="comentario" placeholder="Quer deixar um comentario? (opcional)"></textarea>

        <button type="button" class="principal" id="botaoEnviar" onclick="enviarAvaliacao()">Enviar avaliacao</button>
        <button type="button" class="secundario" onclick="carregarResultado()">Ver resultado consolidado</button>
    </div>

    <!-- TELA 2: CONFIRMACAO -->
    <div id="telaConfirmacao" class="escondido confirmacao">
        <div class="emoji">🎉</div>
        <h1>Obrigado pela avaliacao!</h1>
        <p class="subtitulo">Sua resposta foi registrada com sucesso.</p>
        <button type="button" class="principal" onclick="voltarParaFormulario()">Voltar</button>
    </div>

    <!-- TELA 3: RESULTADO -->
    <div id="telaResultado" class="escondido">
        <div class="faixa">Resultado consolidado</div>
        <div id="resultadoConteudo"></div>
        <button type="button" class="secundario" onclick="voltarParaFormulario()">Voltar para a pesquisa</button>
    </div>

</div>

<script>
    var notaSelecionada = null;

    document.querySelectorAll('.botao-nota').forEach(function (botao) {
        botao.addEventListener('click', function () {
            document.querySelectorAll('.botao-nota').forEach(function (b) {
                b.classList.remove('selecionada');
            });
            botao.classList.add('selecionada');
            notaSelecionada = parseInt(botao.getAttribute('data-nota'));
        });
    });

    function mostrarErro(mensagem) {
        var caixaErro = document.getElementById('mensagemErro');
        caixaErro.textContent = mensagem;
        caixaErro.style.display = 'block';
    }

    function esconderErro() {
        document.getElementById('mensagemErro').style.display = 'none';
    }

    function trocarTela(idTela) {
        document.getElementById('telaFormulario').classList.add('escondido');
        document.getElementById('telaConfirmacao').classList.add('escondido');
        document.getElementById('telaResultado').classList.add('escondido');
        document.getElementById(idTela).classList.remove('escondido');
    }

    function voltarParaFormulario() {
        trocarTela('telaFormulario');
    }

    function enviarAvaliacao() {
        esconderErro();

        if (notaSelecionada === null) {
            mostrarErro('Escolha uma nota de 1 a 5 antes de enviar.');
            return;
        }

        if (!navigator.onLine) {
            mostrarErro('Sem conexao com a internet. Seus dados nao foram perdidos, tente novamente quando conectar.');
            return;
        }

        var comentario = document.getElementById('comentario').value;
        var botao = document.getElementById('botaoEnviar');
        botao.disabled = true;
        botao.textContent = 'Enviando...';

        fetch('/avaliacoes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                usuario: 'usuario-app-smartgroup',
                nota: notaSelecionada,
                comentario: comentario
            })
        })
        .then(function (resposta) {
            if (!resposta.ok) {
                throw new Error('Erro ao enviar');
            }
            return resposta.json();
        })
        .then(function () {
            trocarTela('telaConfirmacao');
            notaSelecionada = null;
            document.getElementById('comentario').value = '';
            document.querySelectorAll('.botao-nota').forEach(function (b) {
                b.classList.remove('selecionada');
            });
        })
        .catch(function () {
            mostrarErro('Nao foi possivel enviar agora. Seus dados nao foram perdidos, tente novamente.');
        })
        .finally(function () {
            botao.disabled = false;
            botao.textContent = 'Enviar avaliacao';
        });
    }

    function carregarResultado() {
        trocarTela('telaResultado');
        var container = document.getElementById('resultadoConteudo');
        container.innerHTML = '<p>Carregando...</p>';

        if (!navigator.onLine) {
            container.innerHTML = '<p>Sem conexao com a internet. Tente novamente mais tarde.</p>';
            return;
        }

        fetch('/avaliacoes/resultado')
            .then(function (resposta) {
                if (!resposta.ok) {
                    throw new Error('Erro ao buscar resultado');
                }
                return resposta.json();
            })
            .then(function (dados) {
                if (!dados.temDados) {
                    container.innerHTML = '<p>Ainda nao ha avaliacoes registradas.</p>';
                    return;
                }

                var html = '';
                html += '<div class="resultado-media">' + dados.mediaGeral.toFixed(1) + ' / 5</div>';
                html += '<p>Baseado em ' + dados.totalAvaliacoes + ' avaliacao(oes)</p>';

                html += '<div class="barra-percentual">';
                html += '<div class="barra-positiva" style="width:' + dados.percentualPositivas + '%">' + dados.percentualPositivas.toFixed(0) + '% positivas</div>';
                html += '<div class="barra-negativa" style="width:' + dados.percentualNegativas + '%">' + dados.percentualNegativas.toFixed(0) + '% negativas</div>';
                html += '</div>';

                html += '<div class="tendencia">Tendencia: ' + dados.tendencia + '</div>';

                container.innerHTML = html;

                if (dados.alerta) {
                    var alerta = document.createElement('div');
                    alerta.className = 'alerta-baixa';
                    alerta.style.display = 'block';
                    alerta.textContent = 'Atencao: a media de satisfacao esta baixa!';
                    container.appendChild(alerta);
                }
            })
            .catch(function () {
                container.innerHTML = '<p>Nao foi possivel carregar o resultado agora. Tente novamente mais tarde.</p>';
            });
    }
</script>

</body>
</html>
